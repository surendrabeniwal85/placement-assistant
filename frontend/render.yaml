services:
  - type: web
    name: placement-assistant-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://placement-assistant-backend-hyfp.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

